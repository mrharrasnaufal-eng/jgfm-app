name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.jagatfilm --project-name jagatfilm .

      - name: Ensure internet permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

      - name: Setup signing
        run: |
          # Decode keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

          # Create key.properties
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../app/upload-keystore.jks
          EOF

          # Inject signing into build.gradle.kts using Python (reliable)
          python3 << 'PYEOF'
          import os

          build_file = "android/app/build.gradle.kts"
          with open(build_file, "r") as f:
              content = f.read()

          # Add key.properties reading and signingConfigs
          signing_block = '''
          import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystoreFile = rootProject.file("key.properties")
          if (keystoreFile.exists()) {
              keystoreProperties.load(FileInputStream(keystoreFile))
          }

          '''

          # Only add if not already present
          if "keystoreProperties" not in content:
              content = signing_block + content

          # Add signingConfigs before buildTypes
          if "signingConfigs" not in content:
              signing_config = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String? ?: ""
                      keyPassword = keystoreProperties["keyPassword"] as String? ?: ""
                      storeFile = file(keystoreProperties["storeFile"] as String? ?: "")
                      storePassword = keystoreProperties["storePassword"] as String? ?: ""
                  }
              }
          '''
              content = content.replace("buildTypes {", signing_config + "\n    buildTypes {")

          # Replace debug signing with release
          content = content.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          with open(build_file, "w") as f:
              f.write(content)

          print("✅ Signing config injected")
          PYEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare deploy
        run: |
          mkdir -p deploy
          cp build/app/outputs/flutter-apk/app-release.apk deploy/app-release.apk

          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$VERSION" | cut -d'+' -f2)

          cat > deploy/version.json << VJEOF
          {
            "version": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "apk_url": "https://jagatfilm.com/download/app-release.apk",
            "changelog": "Update aplikasi terbaru.",
            "force_update": false
          }
          VJEOF

          echo "✅ Version: $VERSION_NAME+$VERSION_CODE"
          ls -la deploy/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: deploy/app-release.apk

      - name: Upload version.json
        uses: actions/upload-artifact@v4
        with:
          name: version-json
          path: deploy/version.json

      - name: Deploy to aaPanel
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AAPANEL_HOST }}
          port: ${{ secrets.AAPANEL_PORT }}
          username: ${{ secrets.AAPANEL_USER }}
          key: ${{ secrets.AAPANEL_SSH_KEY }}
          source: "deploy/app-release.apk,deploy/version.json"
          target: "/tmp/jgfm-deploy"
          overwrite: true

      - name: Move files on server
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AAPANEL_HOST }}
          port: ${{ secrets.AAPANEL_PORT }}
          username: ${{ secrets.AAPANEL_USER }}
          key: ${{ secrets.AAPANEL_SSH_KEY }}
          script: |
            DEPLOY_PATH="${{ secrets.AAPANEL_DEPLOY_PATH }}"
            mkdir -p "$DEPLOY_PATH/download" "$DEPLOY_PATH/app"
            cp /tmp/jgfm-deploy/deploy/app-release.apk "$DEPLOY_PATH/download/app-release.apk"
            cp /tmp/jgfm-deploy/deploy/version.json "$DEPLOY_PATH/app/version.json"
            chmod 644 "$DEPLOY_PATH/download/app-release.apk" "$DEPLOY_PATH/app/version.json"
            rm -rf /tmp/jgfm-deploy
            echo "✅ Deployed!"

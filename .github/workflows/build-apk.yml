name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.jagatfilm --project-name jagatfilm .

      - name: Apply custom notification native files
        run: |
          # Copy layout XML
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/drawable
          cp android-native/res/layout/notification_collapsed.xml android/app/src/main/res/layout/
          cp android-native/res/layout/notification_expanded.xml android/app/src/main/res/layout/
          cp android-native/res/drawable/bg_button_pink.xml android/app/src/main/res/drawable/
          cp android-native/res/drawable/bg_button_pink_large.xml android/app/src/main/res/drawable/

          # Copy Kotlin files (overwrite generated MainActivity, add helper + FCM service)
          KOTLIN_DIR="android/app/src/main/kotlin/com/jagatfilm/jagatfilm"
          mkdir -p "$KOTLIN_DIR"
          cp android-native/kotlin/MainActivity.kt "$KOTLIN_DIR/"
          cp android-native/kotlin/CustomNotificationHelper.kt "$KOTLIN_DIR/"
          cp android-native/kotlin/JagatFilmMessagingService.kt "$KOTLIN_DIR/"

          echo "✅ Custom notification native files applied"
          ls -la "$KOTLIN_DIR"
          ls -la android/app/src/main/res/layout/notification_*
          ls -la android/app/src/main/res/drawable/bg_button_*

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
          echo "✅ google-services.json decoded to android/app/"
          cat android/app/google-services.json | python3 -c "import sys,json;d=json.load(sys.stdin);print('package:', d['client'][0]['client_info']['android_client_info']['package_name'])"

      - name: Add Google Services plugin to project
        run: |
          # Add google-services plugin to project-level build.gradle.kts (apply false)
          PROJECT_GRADLE="android/build.gradle.kts"
          if ! grep -q "com.google.gms.google-services" "$PROJECT_GRADLE"; then
            sed -i '/plugins {/a \    id("com.google.gms.google-services") version "4.4.2" apply false' "$PROJECT_GRADLE"
            echo "✅ google-services plugin added to project build.gradle.kts"
          fi
          cat "$PROJECT_GRADLE"

      - name: Apply JagatFilm launcher icon
        run: |
          ICON_RES="branding/launcher_icon/res"
          test -f "$ICON_RES/mipmap-mdpi/ic_launcher.png"
          test -f "$ICON_RES/mipmap-xxxhdpi/ic_launcher.png"
          test -f "$ICON_RES/mipmap-anydpi-v26/ic_launcher.xml"
          test -f "$ICON_RES/drawable-xxxhdpi/ic_launcher_foreground.png"
          mkdir -p android/app/src/main/res
          cp -R "$ICON_RES"/. android/app/src/main/res/
          echo "✅ Custom legacy and adaptive launcher icons applied"

      - name: Ensure internet permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi
          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' "$MANIFEST"
          fi

      - name: Register custom FCM service in manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()

          # tools namespace needed for tools:node="remove"
          if 'xmlns:tools' not in content:
              content = content.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"',
                  1)

          # Remove FlutterFire's default service (it would win the MESSAGING_EVENT
          # resolution otherwise) and register ours, which extends it via super.
          services = '''    <service
            android:name="io.flutter.plugins.firebase.messaging.FlutterFirebaseMessagingService"
            tools:node="remove" />

            <service
                android:name=".JagatFilmMessagingService"
                android:exported="false">
                <intent-filter>
                    <action android:name="com.google.firebase.MESSAGING_EVENT" />
                </intent-filter>
            </service>
          '''
          if 'JagatFilmMessagingService' not in content:
              idx = content.index('<application')
              end = content.index('>', idx) + 1
              content = content[:end] + '\n' + services + content[end:]

          with open(path, 'w') as f:
              f.write(content)
          print('✅ FCM service registered in manifest')
          PYEOF
          cat "$MANIFEST"

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          ls -la android/app/upload-keystore.jks

      - name: Overwrite build.gradle.kts with signing
        run: |
          cat > android/app/build.gradle.kts << 'GRADLEOF'
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
              id("com.google.gms.google-services") version "4.4.2"
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_11)
              }
          }

          android {
              namespace = "com.jagatfilm.jagatfilm"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }

              defaultConfig {
                  applicationId = "com.jagatfilm.jagatfilm"
                  minSdk = 23
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("upload-keystore.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              // Firebase SDK must be on the app compile classpath for JagatFilmMessagingService
              // (FlutterFire plugins expose it as implementation-only). BoM version must match
              // firebase_core 3.8.1 gradle.properties (FirebaseSDKVersion=33.5.1).
              implementation(platform("com.google.firebase:firebase-bom:33.5.1"))
              implementation("com.google.firebase:firebase-messaging")
          }

          flutter {
              source = "../.."
          }
          GRADLEOF

      - name: Verify signing config
        run: |
          echo "=== Verifying build.gradle.kts ==="
          grep -n "signingConfigs\|create(\"release\")\|signingConfig" android/app/build.gradle.kts
          echo "=== Keystore file ==="
          ls -la android/app/upload-keystore.jks

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Prepare deploy
        run: |
          mkdir -p deploy
          cp build/app/outputs/flutter-apk/app-release.apk deploy/app-release.apk

          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$VERSION" | cut -d'+' -f2)

          cat > deploy/version.json << VJEOF
          {
            "version": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "apk_url": "https://jagatfilm.com/download/app-release.apk",
            "changelog": "Update aplikasi terbaru.",
            "force_update": false
          }
          VJEOF

          echo "✅ Version: $VERSION_NAME+$VERSION_CODE"
          ls -la deploy/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: deploy/app-release.apk

      - name: Upload version.json
        uses: actions/upload-artifact@v4
        with:
          name: version-json
          path: deploy/version.json

      - name: Deploy to aaPanel
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AAPANEL_HOST }}
          port: ${{ secrets.AAPANEL_PORT }}
          username: ${{ secrets.AAPANEL_USER }}
          key: ${{ secrets.AAPANEL_SSH_KEY }}
          source: "deploy/app-release.apk,deploy/version.json"
          target: "/tmp/jgfm-deploy"
          overwrite: true

      - name: Move files on server
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AAPANEL_HOST }}
          port: ${{ secrets.AAPANEL_PORT }}
          username: ${{ secrets.AAPANEL_USER }}
          key: ${{ secrets.AAPANEL_SSH_KEY }}
          script: |
            DEPLOY_PATH="${{ secrets.AAPANEL_DEPLOY_PATH }}"
            mkdir -p "$DEPLOY_PATH/download" "$DEPLOY_PATH/app"
            cp /tmp/jgfm-deploy/deploy/app-release.apk "$DEPLOY_PATH/download/app-release.apk"
            cp /tmp/jgfm-deploy/deploy/version.json "$DEPLOY_PATH/app/version.json"
            chmod 644 "$DEPLOY_PATH/download/app-release.apk" "$DEPLOY_PATH/app/version.json"
            rm -rf /tmp/jgfm-deploy
            echo "✅ Deployed!"

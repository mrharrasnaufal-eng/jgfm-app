name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.jagatfilm .

      - name: Restore Android config
        run: |
          # Ensure internet permission
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml || true
          # Ensure minSdk 21
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts 2>/dev/null || \
          sed -i 's/minSdk.*/minSdk = 21/' android/app/build.gradle 2>/dev/null || true

      - name: Setup signing key
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "SIGNING_AVAILABLE=true" >> $GITHUB_OUTPUT
            echo "✅ Signing key found - will build RELEASE APK"
            
            # Decode keystore
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            
            # Create key.properties
            cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
            
            # Inject signingConfigs into build.gradle
            # Works with both .gradle and .gradle.kts
            if [ -f android/app/build.gradle.kts ]; then
              # Kotlin DSL
              sed -i '/android {/a \
          \    val keystoreProperties = java.util.Properties()\n    val keystoreFile = rootProject.file("app/key.properties")\n    if (keystoreFile.exists()) { keystoreProperties.load(java.io.FileInputStream(keystoreFile)) }\n\n    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String? ?: ""\n            keyPassword = keystoreProperties["keyPassword"] as String? ?: ""\n            storeFile = file(keystoreProperties["storeFile"] as String? ?: "upload-keystore.jks")\n            storePassword = keystoreProperties["storePassword"] as String? ?: ""\n        }\n    }' android/app/build.gradle.kts
              # Change release buildType signing
              sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/' android/app/build.gradle.kts
            else
              # Groovy DSL
              sed -i '/android {/a \
          \    def keystoreProperties = new Properties()\n    def keystoreFile = rootProject.file("app/key.properties")\n    if (keystoreFile.exists()) { keystoreProperties.load(new FileInputStream(keystoreFile)) }\n\n    signingConfigs {\n        release {\n            keyAlias keystoreProperties["keyAlias"]\n            keyPassword keystoreProperties["keyPassword"]\n            storeFile file(keystoreProperties["storeFile"])\n            storePassword keystoreProperties["storePassword"]\n        }\n    }' android/app/build.gradle
              sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' android/app/build.gradle
            fi
          else
            echo "SIGNING_AVAILABLE=false" >> $GITHUB_OUTPUT
            echo "⚠️ WARNING: Signing key NOT found - will build DEBUG APK"
            echo "⚠️ To enable signed release, add these GitHub Secrets:"
            echo "   - ANDROID_KEYSTORE_BASE64"
            echo "   - ANDROID_KEYSTORE_PASSWORD"
            echo "   - ANDROID_KEY_ALIAS"
            echo "   - ANDROID_KEY_PASSWORD"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        if: steps.signing.outputs.SIGNING_AVAILABLE == 'true'
        run: flutter build apk --release

      - name: Build Debug APK (fallback)
        if: steps.signing.outputs.SIGNING_AVAILABLE != 'true'
        run: |
          echo "⚠️ Building DEBUG APK because signing key is not configured"
          flutter build apk --debug

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy

          # Copy APK (release or debug)
          if [ "${{ steps.signing.outputs.SIGNING_AVAILABLE }}" == "true" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk deploy/app-release.apk
            echo "📦 Release APK (signed)"
          else
            cp build/app/outputs/flutter-apk/app-debug.apk deploy/app-release.apk
            echo "⚠️ Debug APK (unsigned) - update will require uninstall if switching from signed"
          fi

          # Extract version from pubspec.yaml
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$VERSION" | cut -d'+' -f2)

          # Create version.json
          cat > deploy/version.json << EOF
          {
            "version": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "apk_url": "https://jagatfilm.com/download/app-release.apk",
            "changelog": "Update aplikasi terbaru.",
            "force_update": false
          }
          EOF

          echo "✅ Version: $VERSION_NAME (code: $VERSION_CODE)"
          cat deploy/version.json
          ls -la deploy/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: deploy/app-release.apk

      - name: Upload version.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-json
          path: deploy/version.json

      - name: Deploy to aaPanel via SSH
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AAPANEL_HOST }}
          port: ${{ secrets.AAPANEL_PORT }}
          username: ${{ secrets.AAPANEL_USER }}
          key: ${{ secrets.AAPANEL_SSH_KEY }}
          source: "deploy/app-release.apk,deploy/version.json"
          target: ${{ secrets.AAPANEL_DEPLOY_PATH }}
          strip_components: 1
          overwrite: true
        continue-on-error: true

      - name: Move files to correct paths on server
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AAPANEL_HOST }}
          port: ${{ secrets.AAPANEL_PORT }}
          username: ${{ secrets.AAPANEL_USER }}
          key: ${{ secrets.AAPANEL_SSH_KEY }}
          script: |
            DEPLOY_PATH="${{ secrets.AAPANEL_DEPLOY_PATH }}"
            mkdir -p "$DEPLOY_PATH/download"
            mkdir -p "$DEPLOY_PATH/app"
            mv "$DEPLOY_PATH/app-release.apk" "$DEPLOY_PATH/download/app-release.apk" 2>/dev/null || true
            mv "$DEPLOY_PATH/version.json" "$DEPLOY_PATH/app/version.json" 2>/dev/null || true
            chmod 644 "$DEPLOY_PATH/download/app-release.apk"
            chmod 644 "$DEPLOY_PATH/app/version.json"
            echo "✅ Deploy complete!"
            ls -la "$DEPLOY_PATH/download/app-release.apk"
            ls -la "$DEPLOY_PATH/app/version.json"
        continue-on-error: true

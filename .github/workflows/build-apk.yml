name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.jagatfilm .

      - name: Restore Android config
        run: |
          # Ensure internet permission
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          fi

      - name: Setup signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "SIGNING_AVAILABLE=true" >> $GITHUB_OUTPUT
            echo "✅ Signing key found - will build RELEASE APK"

            # Decode keystore to android/app/
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

            # Create key.properties in android/
            cat > android/key.properties << KEYEOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../app/upload-keystore.jks
          KEYEOF

            # Patch build.gradle.kts to use signing config
            BUILD_FILE="android/app/build.gradle.kts"
            if [ -f "$BUILD_FILE" ]; then
              # Create a patched version with signing
              cat > /tmp/signing_patch.py << 'PYEOF'
          import re, sys
          
          with open(sys.argv[1], 'r') as f:
              content = f.read()
          
          # Add imports and keystoreProperties before android block
          signing_setup = '''
          import java.util.Properties
          import java.io.FileInputStream
          
          val keystoreProperties = Properties()
          val keystoreFile = rootProject.file("key.properties")
          if (keystoreFile.exists()) {
              keystoreProperties.load(FileInputStream(keystoreFile))
          }
          
          '''
          
          # Add signingConfigs inside android block
          signing_config = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
          
          # Insert signing setup before 'android {'
          if 'keystoreProperties' not in content:
              content = content.replace('android {', signing_setup + 'android {')
          
          # Insert signingConfigs after 'android {'
          if 'signingConfigs' not in content:
              content = content.replace('android {', 'android {\n' + signing_config)
          
          # Change release signing from debug to release
          content = content.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )
          
          # If no release buildType with signing, add it
          if 'signingConfigs.getByName("release")' not in content:
              content = content.replace(
                  'buildTypes {',
                  'buildTypes {\n        release {\n            signingConfig = signingConfigs.getByName("release")\n        }'
              )
          
          with open(sys.argv[1], 'w') as f:
              f.write(content)
          
          print("✅ build.gradle.kts patched for release signing")
          PYEOF
              python3 /tmp/signing_patch.py "$BUILD_FILE"
            fi
          else
            echo "SIGNING_AVAILABLE=false" >> $GITHUB_OUTPUT
            echo "⚠️ Signing key NOT found - building DEBUG APK"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        if: steps.signing.outputs.SIGNING_AVAILABLE == 'true'
        run: flutter build apk --release

      - name: Build Debug APK (fallback)
        if: steps.signing.outputs.SIGNING_AVAILABLE != 'true'
        run: flutter build apk --debug

      - name: Prepare deploy
        run: |
          mkdir -p deploy

          if [ "${{ steps.signing.outputs.SIGNING_AVAILABLE }}" == "true" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk deploy/app-release.apk
            echo "📦 Signed Release APK"
          else
            cp build/app/outputs/flutter-apk/app-debug.apk deploy/app-release.apk
            echo "⚠️ Debug APK (unsigned)"
          fi

          # Generate version.json from pubspec.yaml
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$VERSION" | cut -d'+' -f2)

          cat > deploy/version.json << EOF
          {
            "version": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "apk_url": "https://jagatfilm.com/download/app-release.apk",
            "changelog": "Update aplikasi terbaru.",
            "force_update": false
          }
          EOF

          echo "✅ Version: $VERSION_NAME+$VERSION_CODE"
          ls -la deploy/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: deploy/app-release.apk

      - name: Upload version.json
        uses: actions/upload-artifact@v4
        with:
          name: version-json
          path: deploy/version.json

      - name: Deploy APK to aaPanel
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AAPANEL_HOST }}
          port: ${{ secrets.AAPANEL_PORT }}
          username: ${{ secrets.AAPANEL_USER }}
          key: ${{ secrets.AAPANEL_SSH_KEY }}
          source: "deploy/app-release.apk,deploy/version.json"
          target: "/tmp/jgfm-deploy"
          overwrite: true

      - name: Move files on server
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AAPANEL_HOST }}
          port: ${{ secrets.AAPANEL_PORT }}
          username: ${{ secrets.AAPANEL_USER }}
          key: ${{ secrets.AAPANEL_SSH_KEY }}
          script: |
            DEPLOY_PATH="${{ secrets.AAPANEL_DEPLOY_PATH }}"
            mkdir -p "$DEPLOY_PATH/download" "$DEPLOY_PATH/app"
            cp /tmp/jgfm-deploy/deploy/app-release.apk "$DEPLOY_PATH/download/app-release.apk"
            cp /tmp/jgfm-deploy/deploy/version.json "$DEPLOY_PATH/app/version.json"
            chmod 644 "$DEPLOY_PATH/download/app-release.apk" "$DEPLOY_PATH/app/version.json"
            rm -rf /tmp/jgfm-deploy
            echo "✅ Deployed!"
            ls -la "$DEPLOY_PATH/download/app-release.apk"
            cat "$DEPLOY_PATH/app/version.json"

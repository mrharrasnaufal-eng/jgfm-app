name: jagatfilm
description: JagatFilm - Streaming Drama Indonesia
publish_to: 'none'
version: 2.7.4+35

environment:
  sdk: '>=3.0.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: 1.6.0
  cached_network_image: 3.3.1
  video_player: 2.9.2
  chewie: 1.8.5
  shared_preferences: 2.2.3
  provider: 6.1.2
  shimmer: 3.0.0
  flutter_staggered_grid_view: 0.7.0
  url_launcher: 6.2.6
  package_info_plus: 8.0.2
  webview_flutter: 4.8.0
  # Share ke WhatsApp/dll untuk feed "Untuk Anda" (Reels-style).
  # 13.x bentrok dengan package_info_plus 8.0.2 (win32) — 12.x dipilih agar config proven tetap.
  share_plus: 12.0.2
  # Notifikasi Fase 1 (local notification, TANPA Firebase).
  # Versi dipilih agar TIDAK butuh core library desugaring (18.0.0+ butuh desugaring
  # yang mengharuskan ubah build.gradle.kts — dihindari agar config proven tidak berubah).
  # Package ini juga sudah menangani permintaan izin POST_NOTIFICATIONS (Android 13+)
  # lewat requestNotificationsPermission(), jadi permission_handler tidak diperlukan.
  flutter_local_notifications: 17.2.4
  # Notifikasi Fase 2 (FCM real-time push). Butuh google-services.json (GitHub Secret).
  firebase_core: 3.8.1
  firebase_messaging: 15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2

flutter:
  uses-material-design: true
